name: Terraform CI/CD

run-name: Terraform ${{ github.event.inputs.command }}

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Select the Terraform command"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - destroy
          
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Debug OIDC token
        run: |
          curl -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
          | jq -r '.value' | cut -d. -f2 | base64 -d 2>/dev/null | jq .

       
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::211026994496:role/github-terraform-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS
        run: aws sts get-caller-identity
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Execute Terraform Command
        shell: bash
        run: |
          case "${{ github.event.inputs.command }}" in
            plan)
              echo "Running Terraform Plan..."
              terraform plan
              ;;
            apply)
              echo "Running Terraform Apply..."
              terraform apply -auto-approve
              ;;
            destroy)
              echo "Running Terraform Destroy..."
              terraform destroy -auto-approve
              ;;
            *)
              echo "Invalid command!"
              exit 1
              ;;
          esac
